<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शोक संदेश कार्ड बनाएँ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5a1608">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-page min-h-dvh font-sans text-maroon-900 antialiased">

<svg aria-hidden="true" class="hidden">
  <symbol id="corner" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M3 62V18A15 15 0 0 1 18 3h44" stroke-width="1.6"/>
      <path d="M9 62V22A13 13 0 0 1 22 9h40" stroke-width=".9"/>
    </g>
    <g fill="currentColor">
      <path d="M17 10l7 7l-7 7l-7-7z"/>
      <circle cx="32" cy="17" r="1.6"/><circle cx="17" cy="32" r="1.6"/>
      <circle cx="40" cy="17" r="1"/><circle cx="17" cy="40" r="1"/>
    </g>
  </symbol>
</svg>

<div class="mx-auto max-w-3xl p-2 pt-[max(.5rem,env(safe-area-inset-top))] pb-[max(.5rem,env(safe-area-inset-bottom))] sm:p-6">
<div class="card-frame relative">
  <svg aria-hidden="true" class="absolute top-0 left-0 size-12 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute top-0 right-0 size-12 -scale-x-100 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute bottom-0 left-0 size-12 -scale-y-100 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute right-0 bottom-0 size-12 -scale-100 text-gold-700"><use href="#corner"/></svg>

<main class="relative flex flex-col gap-6 px-5 pt-8 pb-10 sm:px-8">

  <header class="flex items-center gap-4">
    <img src="assets/papa.webp" alt="" width="64" height="64" class="size-16 shrink-0 rounded-full object-cover shadow-[0_0_0_2px_#fffdf6,0_0_0_4px_#c9974a]">
    <div>
      <h1 class="font-display text-2xl leading-tight text-maroon-800">शोक संदेश कार्ड बनाएँ</h1>
      <p class="text-[0.95rem] text-maroon-900/75">नाम लिखें, कार्ड की फ़ोटो गैलरी में सेव करें या सीधे भेजें।</p>
    </div>
  </header>

  <form id="form" class="panel flex flex-col gap-5 p-5" autocomplete="off">
    <fieldset>
      <legend class="mb-2 text-sm font-bold text-gold-800">संबोधन</legend>
      <div class="flex flex-wrap gap-2">
        <label class="chip"><input type="radio" name="p" value="श्रीमान," class="sr-only" checked>श्रीमान</label>
        <label class="chip"><input type="radio" name="p" value="श्रीमती," class="sr-only">श्रीमती</label>
        <label class="chip"><input type="radio" name="p" value="आदरणीय" class="sr-only">आदरणीय</label>
        <label class="chip"><input type="radio" name="p" value="प्रिय" class="sr-only">प्रिय</label>
        <label class="chip"><input type="radio" name="p" value="" class="sr-only">कोई नहीं</label>
      </div>
    </fieldset>

    <label class="block">
      <span class="mb-1.5 block text-sm font-bold text-gold-800">नाम</span>
      <input id="name" maxlength="60" enterkeyhint="done" placeholder="जैसे: मनोज शास्त्री तिवारी जी" class="field font-display text-xl">
    </label>
  </form>

  <section aria-label="कार्ड" class="flex flex-col gap-4">
    <canvas id="card" class="block h-auto w-full rounded-md bg-white shadow-[0_0_0_1px_#e3c787,0_14px_34px_-14px_rgb(61_18_6/0.55)]" role="img" aria-label="शोक संदेश कार्ड"></canvas>

    <div class="grid grid-cols-1 gap-2.5 min-[420px]:grid-cols-2">
      <button type="button" id="save" class="btn-maroon flex min-h-13 items-center justify-center gap-2.5 rounded-xl px-4 text-lg font-bold">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        गैलरी में सेव करें
      </button>
      <button type="button" id="share" class="btn-wa flex min-h-13 items-center justify-center gap-2.5 rounded-xl px-4 text-lg font-bold text-white">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-6" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        WhatsApp / शेयर करें
      </button>
    </div>
    <p id="toast" role="status" class="hidden rounded-lg bg-maroon-800 px-3 py-2 text-center text-sm font-semibold text-cream-50"></p>
    <p class="text-center text-xs text-maroon-900/60">iPhone पर: “शेयर करें” दबाकर “Save Image” चुनें — फ़ोटो सीधे गैलरी में चली जाएगी।</p>
    <p class="text-center text-[0.95rem]">
      <a href="send.html" class="font-semibold text-maroon-800 underline decoration-gold-500 underline-offset-4">नाम वाला वेबसाइट लिंक भेजना है? यहाँ जाएँ →</a>
    </p>
  </section>

</main>
</div>
</div>

<script>
// Draws the printed शोक संदेश card (1280×900 design units, rendered at 2× for sharpness).
const W = 1280, H = 900, SCALE = 2;
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
canvas.width = W * SCALE;
canvas.height = H * SCALE;

const nameEl = document.getElementById('name');
const form = document.getElementById('form');
const INK = '#111';
const font = (weight, size) => `${weight} ${size}px Hind, "Noto Sans Devanagari", Mangal, sans-serif`;
const clean = s => s.replace(/\s+/g, ' ').trim();

const PARA = [
  ['अत्यंत दुःख के साथ सूचित करना पड़ रहा है कि स्व. श्री जानकी प्रसाद जी दुबे के पौत्र, श्री बाबूलाल जी दुबे के सुपुत्र, श्री ओमप्रकाश जी दुबे के भ्राता, निखिल दुबे के पूज्य पिताजी एवं गौरव दुबे के ताऊजी', false],
  ['श्री पूर्णानंद जी दुबे', true],
  ['का स्वर्गवास दिनांक 26/09/2026, शनिवार को हो गया है। उनकी आत्मशांति हेतु उत्तरकार्य निम्नानुसार रखा गया है।', false],
];
const ROWS = [
  ['दशाकर्म :', [['दि. 05/10/2026, सोमवार, आश्विन बदी दशमी', false]]],
  ['पगड़ी रस्म :', [['दि. 09/10/2026, शुक्रवार, आश्विन बदी चतुर्दशी ', false], ['(कपड़ा प्रथा बंद है)', true]]],
  ['ब्रह्मभोज :', [['दि. 09/10/2026, शुक्रवार, दोपहर 1 बजे से', false]]],
  ['स्थान :', [['श्री गौड़ परिसर, उपाध्याय नगर, ब्रिज के पास, मेंढकी रोड, देवास', false]]],
];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Justified paragraph with a first-line indent; bold runs keep their weight.
function paragraph(x, y, width, indent, lineH, size) {
  const words = PARA.flatMap(([t, bold]) => t.split(' ').map(w => ({ w, bold })));
  for (const t of words) { ctx.font = font(t.bold ? 700 : 400, size); t.width = ctx.measureText(t.w).width; }
  ctx.font = font(400, size);
  const space = ctx.measureText(' ').width;
  const lines = [[]];
  let used = 0;
  for (const t of words) {
    const line = lines[lines.length - 1];
    const avail = width - (lines.length === 1 ? indent : 0);
    const add = (line.length ? space : 0) + t.width;
    if (line.length && used + add > avail) { lines.push([t]); used = t.width; }
    else { line.push(t); used += add; }
  }
  lines.forEach((line, i) => {
    const start = x + (i === 0 ? indent : 0);
    const avail = width - (i === 0 ? indent : 0);
    const total = line.reduce((s, t) => s + t.width, 0);
    const gap = i < lines.length - 1 && line.length > 1 ? (avail - total) / (line.length - 1) : space;
    let cx = start;
    for (const t of line) {
      ctx.font = font(t.bold ? 700 : 400, size);
      ctx.fillText(t.w, cx, y + i * lineH);
      cx += t.width + gap;
    }
  });
}

function runs(parts, x, y, size) {
  for (const [t, bold] of parts) {
    ctx.font = font(bold ? 700 : 400, size);
    ctx.fillText(t, x, y);
    x += ctx.measureText(t).width;
  }
}

function rightRuns(parts, right, y, size) {
  let w = 0;
  for (const [t, bold] of parts) { ctx.font = font(bold ? 700 : 400, size); w += ctx.measureText(t).width; }
  runs(parts, right - w, y, size);
}

function draw() {
  const prefix = form.querySelector('input[name=p]:checked').value;
  const name = clean(nameEl.value);

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = INK;
  ctx.strokeStyle = INK;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  // double border
  ctx.lineWidth = 3.5; ctx.strokeRect(36, 36, W - 72, H - 72);
  ctx.lineWidth = 1.8; ctx.strokeRect(45, 45, W - 90, H - 90);

  // heading row
  ctx.font = font(600, 27);
  ctx.fillText('ॐ शांति', 82, 108);
  ctx.textAlign = 'right'; ctx.fillText('ॐ शांति', 1198, 108);
  ctx.textAlign = 'center'; ctx.font = font(700, 68);
  ctx.fillText('शोक संदेश', W / 2, 116);
  ctx.textAlign = 'left';

  // salutation + name on the underline
  let lineStart = 82;
  if (prefix) {
    ctx.font = font(600, 26);
    ctx.fillText(prefix, 82, 183);
    lineStart = 82 + ctx.measureText(prefix).width + 14;
  }
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(lineStart, 193); ctx.lineTo(1198, 193); ctx.stroke();
  if (name) {
    const nx = lineStart + 42, maxW = 1198 - nx - 8;
    let size = 42;
    do { ctx.font = font(400, size); } while (ctx.measureText(name).width > maxW && --size > 20);
    ctx.fillText(name, nx, 177);
  }

  // announcement
  paragraph(82, 239, 1116, 63, 44, 26.5);

  // programme box with its tab
  ctx.lineWidth = 3;
  roundRect(83, 371, 1114, 216, 24); ctx.stroke();
  ctx.font = font(700, 25);
  const tabW = ctx.measureText('कार्यक्रम').width + 48;
  roundRect(W / 2 - tabW / 2, 350, tabW, 42, 13);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.fillText('कार्यक्रम', W / 2, 380);

  ROWS.forEach(([label, value], i) => {
    const y = 428 + i * 44;
    ctx.textAlign = 'right'; ctx.font = font(700, 26.5); ctx.fillText(label, 374, y);
    ctx.textAlign = 'left'; runs(value, 388, y, 26.5);
  });

  // family and contacts
  ctx.font = font(700, 26); ctx.fillText('शोकाकुल :', 82, 644);
  ctx.font = font(400, 26); ctx.fillText('समस्त दुबे परिवार', 82, 684);
  rightRuns([['ओमप्रकाश दुबे  मो. : ', false], ['9424597307', true]], 1198, 639, 26);
  rightRuns([['निखिल दुबे  मो. : ', false], ['8962132378', true]], 1198, 683, 26);
}

let queued = false;
function redraw() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; draw(); });
}
form.addEventListener('input', redraw);
form.addEventListener('submit', e => { e.preventDefault(); nameEl.blur(); });

// ─── save / share ───
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add('hidden'), 3000);
}
function fileName() {
  const n = clean(nameEl.value).replace(/[\\/:*?"<>|.]/g, '').replace(/\s+/g, '-');
  return `शोक-संदेश${n ? '-' + n : ''}.png`;
}
const toBlob = () => new Promise(r => canvas.toBlob(r, 'image/png'));

async function download() {
  const blob = await toBlob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('कार्ड सेव हो गया ✓');
}

document.getElementById('save').onclick = () => {
  if (!clean(nameEl.value) && !confirm('नाम खाली है। बिना नाम का कार्ड सेव करें?')) return nameEl.focus();
  download();
};

document.getElementById('share').onclick = async () => {
  if (!clean(nameEl.value) && !confirm('नाम खाली है। बिना नाम का कार्ड भेजें?')) return nameEl.focus();
  const file = new File([await toBlob()], fileName(), { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
  } else {
    await download();
    toast('इस ब्राउज़र में सीधे शेयर नहीं होता — कार्ड सेव कर दिया है, अब WhatsApp से भेजें');
  }
};

// Optional prefill: generator.html?name=…
nameEl.value = new URLSearchParams(location.search).get('name') || '';

// Draw immediately, then again once the Hind font has arrived.
draw();
Promise.all([400, 600, 700].map(w => document.fonts.load(font(w, 26), 'शोक संदेश'))).then(draw, draw);
document.fonts.ready.then(draw);
</script>
</body>
</html>
