<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शोक संदेश भेजें</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5a1608">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-page min-h-dvh font-sans text-maroon-900 antialiased">

<svg aria-hidden="true" class="hidden">
  <symbol id="corner" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M3 62V18A15 15 0 0 1 18 3h44" stroke-width="1.6"/>
      <path d="M9 62V22A13 13 0 0 1 22 9h40" stroke-width=".9"/>
    </g>
    <g fill="currentColor">
      <path d="M17 10l7 7l-7 7l-7-7z"/>
      <circle cx="32" cy="17" r="1.6"/><circle cx="17" cy="32" r="1.6"/>
      <circle cx="40" cy="17" r="1"/><circle cx="17" cy="40" r="1"/>
    </g>
  </symbol>
</svg>

<div class="mx-auto max-w-xl p-2 pt-[max(.5rem,env(safe-area-inset-top))] pb-[max(.5rem,env(safe-area-inset-bottom))] sm:p-6">
<div class="card-frame relative">
  <svg aria-hidden="true" class="absolute top-0 left-0 size-12 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute top-0 right-0 size-12 -scale-x-100 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute bottom-0 left-0 size-12 -scale-y-100 text-gold-700"><use href="#corner"/></svg>
  <svg aria-hidden="true" class="absolute right-0 bottom-0 size-12 -scale-100 text-gold-700"><use href="#corner"/></svg>

<main class="relative flex flex-col gap-6 px-5 pt-8 pb-10 sm:px-8">

  <header class="flex items-center gap-4">
    <img src="assets/papa.webp" alt="" width="64" height="64" class="size-16 shrink-0 rounded-full object-cover shadow-[0_0_0_2px_#fffdf6,0_0_0_4px_#c9974a]">
    <div>
      <h1 class="font-display text-2xl leading-tight text-maroon-800">व्यक्तिगत शोक संदेश भेजें</h1>
      <p class="text-[0.95rem] text-maroon-900/75">नाम लिखें — उनके नाम के साथ संदेश का लिंक बनेगा।</p>
    </div>
  </header>

  <form id="form" class="panel flex flex-col gap-5 p-5" autocomplete="off">
    <fieldset>
      <legend class="mb-2 text-sm font-bold text-gold-800">संबोधन</legend>
      <div class="flex flex-wrap gap-2" id="prefixes">
        <label class="chip"><input type="radio" name="p" value="0" class="sr-only" checked>श्रीमान</label>
        <label class="chip"><input type="radio" name="p" value="1" class="sr-only">श्रीमती</label>
        <label class="chip"><input type="radio" name="p" value="2" class="sr-only">आदरणीय</label>
        <label class="chip"><input type="radio" name="p" value="3" class="sr-only">प्रिय</label>
        <label class="chip"><input type="radio" name="p" value="4" class="sr-only">कोई नहीं</label>
      </div>
    </fieldset>

    <label class="block">
      <span class="mb-1.5 block text-sm font-bold text-gold-800">नाम</span>
      <input id="name" name="name" required maxlength="80" enterkeyhint="send"
             placeholder="जैसे: मनोज शास्त्री तिवारी जी"
             class="field font-display text-xl">
    </label>

    <label class="block">
      <span class="mb-1.5 block text-sm font-bold text-gold-800">मोबाइल नंबर <span class="font-medium text-maroon-900/60">(वैकल्पिक — सीधे उनकी WhatsApp चैट खुलेगी)</span></span>
      <input id="phone" name="phone" type="tel" inputmode="tel" maxlength="16" placeholder="98xxxxxxxx"
             class="field tracking-wide tabular-nums">
    </label>

    <!-- Live preview of the greeting as it will appear on the card -->
    <div aria-live="polite" class="rounded-xl border border-dashed border-gold-500/70 bg-cream-100 px-4 py-4 text-center">
      <p class="text-xs font-semibold tracking-wide text-gold-800/80">कार्ड पर ऐसा दिखेगा</p>
      <p id="pv-prefix" class="mt-2 text-[1.05rem] font-semibold text-gold-800">श्रीमान,</p>
      <p id="pv-name" class="font-display text-[1.6rem] leading-snug break-words text-maroon-800/40">आपका नाम</p>
    </div>

    <div class="flex flex-col gap-2.5">
      <button type="submit" class="btn-wa flex min-h-13 items-center justify-center gap-2.5 rounded-xl px-4 text-lg font-bold text-white">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-6" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        WhatsApp पर भेजें
      </button>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" id="copy" class="btn-ghost">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>संदेश कॉपी करें</span>
        </button>
        <button type="button" id="other" class="btn-ghost">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          अन्य ऐप से भेजें
        </button>
      </div>
      <a id="open" href="./" target="_blank" rel="noopener" class="mt-1 text-center text-[0.95rem] font-semibold text-maroon-800 underline decoration-gold-500 underline-offset-4">
        पहले कार्ड खोलकर देखें ↗
      </a>
    </div>
    <p id="toast" role="status" class="hidden rounded-lg bg-maroon-800 px-3 py-2 text-center text-sm font-semibold text-cream-50"></p>
  </form>

  <section id="sent-box" hidden aria-labelledby="sent-title">
    <div class="mb-2 flex items-baseline justify-between">
      <h2 id="sent-title" class="font-display text-xl text-maroon-800">भेजे गए <span id="sent-count" class="font-sans text-base text-gold-800"></span></h2>
      <button type="button" id="clear" class="text-sm font-semibold text-maroon-800/70 underline underline-offset-4">सूची हटाएँ</button>
    </div>
    <p class="mb-3 text-xs text-maroon-900/60">यह सूची सिर्फ़ इसी फ़ोन/ब्राउज़र में रहती है।</p>
    <ul id="sent" class="flex flex-col gap-2"></ul>
  </section>

</main>
</div>
</div>

<script>
const SITE = 'https://shok.message.dubeynikhil.in/';
const PREFIXES = ['श्रीमान,', 'श्रीमती,', 'आदरणीय', 'प्रिय', ''];
const $ = id => document.getElementById(id);
const form = $('form'), nameEl = $('name'), phoneEl = $('phone');

const clean = s => s.replace(/\s+/g, ' ').trim();
const b64url = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const prefixIndex = () => Number(form.querySelector('input[name=p]:checked').value);

function linkFor(name, p) {
  return SITE + '?n=' + b64url(name) + (p ? '&p=' + p : '');
}
function messageFor(name, p) {
  const greet = clean(`${PREFIXES[p]} ${name}`).replace(/,$/, '') + ',';
  return `${greet}

अत्यंत दुःख के साथ सूचित करना पड़ रहा है कि श्री पूर्णानंद जी दुबे का स्वर्गवास दिनांक 26/09/2026, शनिवार को हो गया है।

🪔 दशाकर्म : 05/10/2026, सोमवार
🪔 पगड़ी रस्म एवं ब्रह्मभोज : 09/10/2026, शुक्रवार (दोपहर 1 बजे से)
📍 श्री गौड़ परिसर, उपाध्याय नगर, देवास

शोक संदेश देखें :
${linkFor(name, p)}

शोकाकुल : समस्त दुबे परिवार`;
}
function waNumber(raw) {
  const d = raw.replace(/\D/g, '').replace(/^0+/, '');
  if (d.length === 10) return '91' + d;
  if (d.length === 12 && d.startsWith('91')) return d;
  return d.length >= 8 ? d : '';
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add('hidden'), 2500);
}

function refreshPreview() {
  const name = clean(nameEl.value), p = prefixIndex();
  $('pv-prefix').textContent = PREFIXES[p];
  $('pv-prefix').hidden = !PREFIXES[p];
  $('pv-name').textContent = name || 'आपका नाम';
  $('pv-name').classList.toggle('text-maroon-800/40', !name);
  $('open').href = name ? linkFor(name, p) : './';
}
form.addEventListener('input', refreshPreview);

// ─── "Sent" history, kept only in this browser ───
const KEY = 'shok-sent-v1';
function loadSent() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveSent(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
function remember(name, p, phone) {
  const list = loadSent().filter(x => !(x.name === name && x.p === p));
  list.unshift({ name, p, phone, at: Date.now() });
  saveSent(list.slice(0, 300));
  renderSent();
}
function renderSent() {
  const list = loadSent(), ul = $('sent');
  $('sent-box').hidden = !list.length;
  $('sent-count').textContent = `(${list.length})`;
  ul.replaceChildren(...list.map((x, i) => {
    const li = document.createElement('li');
    li.className = 'panel flex items-center gap-3 px-3 py-2';
    const txt = document.createElement('div');
    txt.className = 'min-w-0 flex-1';
    const n = document.createElement('p');
    n.className = 'truncate font-semibold text-maroon-800';
    n.textContent = clean(`${PREFIXES[x.p]} ${x.name}`);
    const meta = document.createElement('p');
    meta.className = 'text-xs text-maroon-900/60';
    meta.textContent = new Date(x.at).toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + (x.phone ? ' • ' + x.phone : '');
    txt.append(n, meta);
    const again = document.createElement('button');
    again.type = 'button';
    again.className = 'shrink-0 rounded-lg border border-gold-500/70 px-3 py-1.5 text-sm font-bold text-maroon-800 hover:bg-gold-100';
    again.textContent = 'फिर भेजें';
    again.onclick = () => {
      nameEl.value = x.name; phoneEl.value = x.phone || '';
      form.querySelector(`input[name=p][value="${x.p}"]`).checked = true;
      refreshPreview(); window.scrollTo({ top: 0, behavior: 'smooth' }); nameEl.focus();
    };
    li.append(txt, again);
    return li;
  }));
}
$('clear').onclick = () => { if (confirm('भेजे गए नामों की सूची हटाएँ?')) { saveSent([]); renderSent(); } };

// ─── Actions ───
function current() {
  const name = clean(nameEl.value);
  if (!name) { nameEl.focus(); toast('कृपया पहले नाम लिखें'); return null; }
  return { name, p: prefixIndex(), phone: clean(phoneEl.value) };
}
function resetForNext() {
  nameEl.value = ''; phoneEl.value = ''; refreshPreview();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const c = current(); if (!c) return;
  const num = waNumber(c.phone);
  const url = (num ? 'https://wa.me/' + num : 'https://wa.me/') + '?text=' + encodeURIComponent(messageFor(c.name, c.p));
  window.open(url, '_blank', 'noopener');
  remember(c.name, c.p, c.phone);
  resetForNext();
});

$('copy').onclick = async () => {
  const c = current(); if (!c) return;
  try {
    await navigator.clipboard.writeText(messageFor(c.name, c.p));
    remember(c.name, c.p, c.phone);
    toast('संदेश कॉपी हो गया — अब कहीं भी पेस्ट करें');
  } catch (e) {
    prompt('इस संदेश को कॉपी करें:', messageFor(c.name, c.p));
  }
};

$('other').onclick = async () => {
  const c = current(); if (!c) return;
  if (!navigator.share) { $('copy').click(); return; }
  try {
    await navigator.share({ text: messageFor(c.name, c.p) });
    remember(c.name, c.p, c.phone);
    resetForNext();
  } catch (e) {}
};

refreshPreview();
renderSent();
</script>
</body>
</html>
